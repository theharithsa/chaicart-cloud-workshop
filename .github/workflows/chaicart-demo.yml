name: ChaiCart demo — test and deploy

on:
  push:
    branches: [main]
    paths: ['chaicart-demo/**', '.github/workflows/chaicart-demo.yml']
  pull_request:
    paths: ['chaicart-demo/**', '.github/workflows/chaicart-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaicart-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaicart-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    needs: test
    runs-on: ubuntu-latest
    environment: workshop
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: chaicart-demo
