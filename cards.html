<style>
  .bingo { width: 90mm; background: #fff; border: .25mm solid #DCD6CA; border-radius: 3mm; padding: 5mm; break-inside: avoid; position: relative; overflow: hidden; }
  .bingo::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.2mm; background: var(--clay); }
  .bingo h4 { margin: 0 0 3.5mm; display: flex; justify-content: space-between; align-items: baseline; }
  .bingo h4 span:first-child { font-family: var(--serif); font-weight: 500; font-size: 15pt; letter-spacing: .35em; color: var(--ink); }
  .bingo h4 span:last-child { font-size: 6pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bingo table { table-layout: fixed; background: transparent; border-collapse: separate; border-spacing: 1mm; }
  .bingo td { height: 14mm; text-align: center; vertical-align: middle; font-size: 7pt; font-weight: 500; padding: 1mm; border: .25mm solid var(--line); border-radius: 1.5mm; background: #fff; color: var(--ink-2); line-height: 1.25; }

  .bingo-grid { display: flex; flex-wrap: wrap; gap: 3mm; }
  .ticket { width: 90mm; height: 64mm; }
  .ticket table { background: transparent; }
  .ticket th, .ticket td { font-size: 7pt; padding: 1.2mm 1.5mm; border-color: var(--line); }
  .ticket th { background: var(--ivory-2); font-weight: 600; color: var(--ink-2); }
  .tent { width: 100%; height: 128mm; background: #fff; border: .25mm solid #DCD6CA; border-radius: 3mm; margin-bottom: 6mm; display: grid; grid-template-rows: 1fr 1fr; break-inside: avoid; page-break-inside: avoid; overflow: hidden; }
  .tent .half { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
  .tent .half.flip { transform: rotate(180deg); border-top: .3mm dashed #B9B5AA; }
  .tent .rg { font-size: 9pt; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--clay-d); }
  .tent .nm { font-family: var(--serif); font-size: 44pt; font-weight: 500; letter-spacing: -.01em; margin: 2mm 0; color: var(--ink); }
  .tent .tg { font-size: 8.5pt; color: var(--muted); letter-spacing: .08em; }
  .tent .half::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.2mm; background: var(--clay); }

const root = document.getElementById('root');
const only = document.getElementById('only');

function renderDeck(d) {
  const page = document.createElement('div');
  page.className = 'page';
  page.dataset.deck = d.id;
  page.insertAdjacentHTML('beforeend', deckTitle(d.name, d.note));
  const wrap = document.createElement('div');
  wrap.className = 'cards';
  d.cards.flatMap((c, n) => Array.from({ length: c.qty || 1 }, () => [c, n])).forEach(([c, n]) => {
    const isKey = c.foot === 'Facilitator only';
    const isTwist = c.cls === 'twist';
    const el = document.createElement('div');
    el.className = ['gcard', d.size === 'large' ? 'large' : '', c.cls || '', isKey ? 'key' : ''].join(' ').trim();
    el.style.setProperty('--acc', d.color);
    const label = isKey ? 'Answer key' : isTwist ? 'Plot twist' : d.name;
    const title = isTwist ? c.t.replace(/^TWIST:\s*/, '') : c.t;
    let html = `<div class="top"><span class="deck"><i></i>${label}</span><span class="no">${String(n + 1).padStart(2, '0')}</span></div>`;
    if (title) html += `<div class="ttl">${title}</div>`;
    if (c.s) html += `<div class="sub">${c.s}</div>`;
    if (c.delta !== undefined) {
      const num = typeof c.delta === 'number';
      const cls = num ? (c.delta < 0 ? 'neg' : 'pos') : 'mix';
      const txt = num ? (c.delta > 0 ? '+' : '−') + Math.abs(c.delta) : c.delta;
      html += `<div class="delta ${cls}">${txt}<small>credits</small></div>`;
    }
    if (c.cls !== 'statement') html += '<div class="rule"></div>';
    html += `<div class="body">${c.b || ''}</div><div class="foot"><span>${c.foot || 'Cloud workshop'}</span><span>ChaiCart</span></div>`;
    el.innerHTML = html;
    wrap.appendChild(el);
  });
  page.appendChild(wrap);
  return page;
}

function deckTitle(name, note) {
  const [kicker, ...rest] = note.split(' · ');
  return `<div class="deck-title"><div class="dt-k">${kicker}</div><div class="dt-h">${name}</div><small>${rest.join(' · ')}</small></div>`;
}

decks.forEach(d => {
  root.appendChild(renderDeck(d));
  const o = document.createElement('option');
  o.value = d.id; o.textContent = d.name;
  only.appendChild(o);
});

(() => {
  const caller = document.createElement('div');
  caller.className = 'page';
  caller.dataset.deck = 'bingo';
  let rows = bingoPool.map((p, n) => `<tr><td>${n + 1}</td><td>${p[1]}</td><td><b>${p[0]}</b></td><td style="width:10mm"></td></tr>`).join('');
  caller.innerHTML = deckTitle('Cloud Bingo: caller sheet', 'Day 1 · Read clues in random order and tick each one. The winner shouts “AUTOSCALE!”') +
    `<table><tr><th style="width:8mm">#</th><th>Clue (read aloud)</th><th style="width:45mm">Answer</th><th style="width:10mm">✓</th></tr>${rows}</table>`;
  root.appendChild(caller);

  const cardsPage = document.createElement('div');
  cardsPage.className = 'page';
  cardsPage.dataset.deck = 'bingo';
  cardsPage.innerHTML = deckTitle('Cloud Bingo: player cards', 'Day 1 · One card per team: 24 cards, randomised on every page load. Reload for a new set.');
  const grid = document.createElement('div');
  grid.className = 'bingo-grid';
  for (let c = 0; c < 24; c++) {
    const picks = [...bingoPool].sort(() => Math.random() - 0.5).slice(0, 24).map(p => p[0]);
    picks.splice(12, 0, null);
    let html = `<h4><span>CLOUD</span><span>Card ${c + 1}</span></h4><table>`;
    for (let r = 0; r < 5; r++) {
      html += '<tr>' + picks.slice(r * 5, r * 5 + 5).map(p => p === null ? '<td class="free">FREE</td>' : `<td>${p}</td>`).join('') + '</tr>';
    }
    const b = document.createElement('div');
    b.className = 'bingo';
    b.innerHTML = html + '</table>';
    grid.appendChild(b);
  }
  cardsPage.appendChild(grid);
  root.appendChild(cardsPage);
  const o = document.createElement('option'); o.value = 'bingo'; o.textContent = 'Cloud Bingo'; only.appendChild(o);
})();

only.addEventListener('change', () => {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('no-print', !!only.value && p.dataset.deck !== only.value);
    p.style.opacity = !only.value || p.dataset.deck === only.value ? 1 : .35;
  });
});
